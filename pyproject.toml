[project]
name = "case-batch-validator"
version = "0.1.0"
description = "Validate a batch of meter-exchange cases before a bulk system update."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
case-validator = "case_validator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
